services:
  ollama-sim:
    build: .
    container_name: ollama-sim
    restart: unless-stopped

    ports:
      - "11434:11434"       # même port que le vrai Ollama

    environment:
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - MISTRAL_BASE_URL=${MISTRAL_BASE_URL:-https://api.mistral.ai/v1}

    volumes:
      - ./logs:/app/logs    # logs persistants sur l'hôte

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:11434/api/version')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    networks:
      - ollama-net

networks:
  ollama-net:
    driver: bridge
